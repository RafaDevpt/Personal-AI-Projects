# ===========================================================================
# PT-PT: Integracao continua do IT Toolkit.
#
#        Um runner so, e nao tres. Ao contrario dos outros projectos deste
#        repositorio, este corre apenas em Windows -- por construcao, nao por
#        falta de porte: le registos de eventos por wevtutil, inventario por
#        WMI, servicos por sc e PowerShell. As pastas Linux/ e macOS/ existem
#        para explicar isso, e nao ha nelas codigo para testar.
#
#        Uma matriz de tres aqui daria dois runners a nao fazer nada e um verde
#        que nao significava o que parece.
#
# EN-UK: Continuous integration for the IT Toolkit.
#
#        One runner, not three. Unlike the other projects here, this one runs on
#        Windows only -- by construction. Its Linux/ and macOS/ folders exist to
#        explain that, and hold no code to test.
#
# Created by Redfox using Claude
# ===========================================================================
name: CI

on:
  push:
    branches: [IT-Tool-Kit]
  pull_request:
    branches: [IT-Tool-Kit]
  workflow_dispatch:

jobs:
  verificar:
    name: Windows em windows-latest
    runs-on: windows-latest

    defaults:
      run:
        working-directory: IT-Toolkit/Windows

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: IT-Toolkit/Windows/requirements-dev.txt

      - name: Instalar dependencias / Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Testes (pytest) / Tests (pytest)
        run: python -m pytest

      - name: Diagnostico / Diagnostic
        run: python -m ittoolkit --diagnostico || true
        env:
          PYTHONPATH: src
