# ===========================================================================
# PT-PT: Integracao continua do Transcritor Medico PT.
#
#        Ha tres versoes independentes -- Windows/, Linux/ e macOS/ -- e cada
#        uma corre no seu proprio sistema. Nao e simetria por simetria: uma
#        versao de Linux testada num runner de Windows nao prova nada sobre o
#        que ela faz em Linux, e era exactamente isso que estava por verificar.
#
#        Com esta matriz, a versao de Linux e testada numa Ubuntu a serio, com
#        um /etc/os-release verdadeiro, e a de macOS num Mac a serio, com o
#        Homebrew e o Python da Apple no sitio. Um erro de porte deixa de ser
#        uma suposicao e passa a ser um teste vermelho.
#
#        O `fail-fast: false` e deliberado: se a versao de Linux partir, quer-se
#        saber na mesma se as outras duas estao bem. Parar tudo a primeira falha
#        esconde metade da informacao.
#
# EN-UK: Continuous integration for the Portuguese Medical Transcriber.
#
#        There are three independent versions -- Windows/, Linux/ and macOS/ --
#        and each runs on its own system. This is not symmetry for its own sake:
#        a Linux version tested on a Windows runner proves nothing about what it
#        does on Linux, and that was exactly what remained unverified.
#
#        With this matrix, the Linux version is tested on a real Ubuntu with a
#        real /etc/os-release, and the macOS one on a real Mac with Homebrew and
#        Apple's Python where they belong. A porting mistake stops being an
#        assumption and becomes a red test.
#
# Created by Redfox using Claude
# ===========================================================================
name: CI

on:
  push:
    branches: [Medical-Audio-to-Text]
  pull_request:
    branches: [Medical-Audio-to-Text]
  workflow_dispatch:

jobs:
  verificar:
    name: ${{ matrix.versao }} em ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      # PT-PT: Se uma versao partir, quer-se saber das outras na mesma.
      # EN-UK: If one version breaks, the others' state is still wanted.
      fail-fast: false
      matrix:
        include:
          - versao: Windows
            runner: windows-latest
          - versao: Linux
            runner: ubuntu-latest
          - versao: macOS
            runner: macos-latest

    defaults:
      run:
        working-directory: Transcritor-Medico-PT/${{ matrix.versao }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Transcritor-Medico-PT/${{ matrix.versao }}/requirements-dev.txt

      # PT-PT: O Tkinter e um pacote a parte em Linux. Sem ele, os testes que
      #        verificam a sua presenca reportavam "em falta" num runner onde
      #        so faltava porque ninguem o instalou -- o que nao prova nada.
      # EN-UK: Tkinter is a separate package on Linux. Without it, the tests
      #        checking for its presence would report "missing" on a runner
      #        where it was only missing because nobody installed it.
      - name: Dependencias de sistema (Linux)
        if: matrix.versao == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libportaudio2
        working-directory: .

      - name: Instalar dependencias / Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Testes (pytest) / Tests (pytest)
        run: python -m pytest

      # PT-PT: O diagnostico corre no fim porque e a unica coisa aqui que
      #        exercita o modulo especifico do sistema contra o sistema real.
      #        Num Ubuntu le o /etc/os-release verdadeiro; num Mac ve o Homebrew.
      #        Sai com 2 quando falta o essencial -- e nos runners falta mesmo o
      #        FFmpeg, por isso o codigo de saida e ignorado de proposito: o que
      #        se verifica e que o relatorio sai sem rebentar.
      # EN-UK: The diagnostic runs last because it is the only thing here that
      #        exercises the system-specific module against the real system. It
      #        exits 2 when essentials are missing -- and FFmpeg genuinely is
      #        missing on the runners, so the exit code is ignored on purpose:
      #        what is verified is that the report comes out without blowing up.
      - name: Diagnostico no sistema real / Diagnostic on the real system
        run: python -m transcriber --diagnostico || true
        env:
          PYTHONPATH: src
