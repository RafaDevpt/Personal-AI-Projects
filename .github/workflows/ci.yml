# ===========================================================================
# PT-PT: Integracao continua do Network-Config-Builder.
#
#        Ha tres versoes independentes -- Windows/, Linux/ e macOS/ -- e cada
#        uma corre no seu proprio sistema. Nao e simetria por simetria: uma
#        versao de Linux testada num runner de Windows nao prova nada sobre o
#        que ela faz em Linux.
#
#        Com esta matriz, a versao de Linux e testada numa Ubuntu a serio, com
#        um /etc/os-release verdadeiro, e a de macOS num Mac a serio. Um erro
#        de porte deixa de ser uma suposicao e passa a ser um teste vermelho.
#
#        O `fail-fast: false` e deliberado: se uma versao partir, quer-se saber
#        na mesma o estado das outras duas.
#
# EN-UK: Continuous integration for Network-Config-Builder.
#
#        Three independent versions, each tested on its own system. A Linux
#        version tested on a Windows runner proves nothing about what it does
#        on Linux.
#
# Created by Redfox using Claude
# ===========================================================================
name: CI

on:
  push:
    branches: [Network-Config-Builder]
  pull_request:
    branches: [Network-Config-Builder]
  workflow_dispatch:

jobs:
  verificar:
    name: ${{ matrix.versao }} em ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - versao: Windows
            runner: windows-latest
          - versao: Linux
            runner: ubuntu-latest
          - versao: macOS
            runner: macos-latest

    defaults:
      run:
        working-directory: Network-Config-Builder/${{ matrix.versao }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Network-Config-Builder/${{ matrix.versao }}/requirements-dev.txt

      # PT-PT: O Tkinter e um pacote a parte em Linux. Sem ele, o teste que
      #        verifica a sua presenca reportava "em falta" num runner onde so
      #        faltava porque ninguem o instalou -- o que nao prova nada.
      # EN-UK: Tkinter is a separate package on Linux. Without it the presence
      #        test would report "missing" on a runner where it was only missing
      #        because nobody installed it.
      - name: Dependencias de sistema (Linux)
        if: matrix.versao == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
        working-directory: .

      - name: Instalar dependencias / Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Testes (pytest) / Tests (pytest)
        run: python -m pytest

      # PT-PT: E a unica coisa aqui que exercita o modulo especifico do sistema
      #        contra o sistema real: num Ubuntu le o /etc/os-release verdadeiro,
      #        num Mac ve o Homebrew. Sai com 2 quando falta um essencial, e nos
      #        runners pode mesmo faltar -- por isso o codigo de saida e
      #        ignorado: o que se verifica e que o relatorio sai sem rebentar.
      # EN-UK: The only step exercising the system-specific module against the
      #        real system. Its exit code is ignored on purpose: what is
      #        verified is that the report comes out without blowing up.
      - name: Diagnostico no sistema real / Diagnostic on the real system
        run: python -m netconfig --diagnostico || true
        env:
          PYTHONPATH: src
