# ===========================================================================
# PT-PT: Integracao continua do IT Toolkit.
#
#        Ha tres versoes independentes -- Windows/, Linux/ e macOS/ -- e cada
#        uma corre no seu proprio sistema. Nao e simetria por simetria: uma
#        versao de Linux testada num runner de Windows nao prova nada sobre o
#        que ela faz em Linux, e era exactamente isso que estava por verificar.
#
#        Neste projecto a matriz vale mais do que nos outros, porque as tres
#        versoes nao sao a mesma aplicacao com tres lancadores: sao tres
#        aplicacoes que respondem a mesma pergunta em sitios diferentes. A de
#        Windows le event logs e WMI; a de Linux le o diario do systemd e o
#        /sys; a de macOS le o diario unificado, o launchd e o diskutil. Nenhuma
#        delas tem sentido no sistema das outras, e so um runner nativo diz se
#        cada uma faz o que promete.
#
#        O `fail-fast: false` e deliberado: se a versao de Linux partir,
#        quer-se saber na mesma se as outras duas estao bem. Parar tudo a
#        primeira falha esconde metade da informacao.
#
# EN-UK: Continuous integration for the IT Toolkit.
#
#        There are three independent versions -- Windows/, Linux/ and macOS/ --
#        and each runs on its own system. Here the matrix is worth more than in
#        the sibling projects, because the three versions are not one
#        application with three launchers: they are three applications answering
#        the same question in different places. Windows reads event logs and
#        WMI; Linux reads the systemd journal and /sys; macOS reads the unified
#        log, launchd and diskutil. None of them makes sense on the others'
#        system, and only a native runner says whether each does what it claims.
#
# Created by Redfox using Claude
# ===========================================================================
name: CI

on:
  push:
    branches: [IT-Tool-Kit]
  pull_request:
    branches: [IT-Tool-Kit]
  workflow_dispatch:

jobs:
  verificar:
    name: ${{ matrix.versao }} em ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      # PT-PT: Se uma versao partir, quer-se saber das outras na mesma.
      # EN-UK: If one version breaks, the others' state is still wanted.
      fail-fast: false
      matrix:
        include:
          - versao: Windows
            runner: windows-latest
          - versao: Linux
            runner: ubuntu-latest
          - versao: macOS
            runner: macos-latest

    defaults:
      run:
        working-directory: IT-Toolkit/${{ matrix.versao }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: IT-Toolkit/${{ matrix.versao }}/requirements-dev.txt

      # PT-PT: O Tkinter e um pacote a parte em Linux. Sem ele, o teste que
      #        verifica a sua presenca reportava "em falta" num runner onde so
      #        faltava porque ninguem o instalou -- o que nao prova nada.
      # EN-UK: Tkinter is a separate package on Linux. Without it, the test
      #        checking for its presence would report "missing" on a runner
      #        where it was only missing because nobody installed it.
      - name: Dependencias de sistema (Linux)
        if: matrix.versao == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
        working-directory: .

      - name: Instalar dependencias / Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Testes (pytest) / Tests (pytest)
        run: python -m pytest

      # PT-PT: O diagnostico corre no fim porque e a unica coisa aqui que
      #        exercita o modulo especifico do sistema contra o sistema real: no
      #        Ubuntu le o /etc/os-release verdadeiro e ve o systemd do runner;
      #        no Mac ve o Homebrew e testa o TCC a serio.
      # EN-UK: The diagnostic runs last because it is the only thing here that
      #        exercises the system-specific module against the real system.
      - name: Diagnostico no sistema real / Diagnostic on the real system
        run: python -m ittoolkit --diagnostico || true
        env:
          PYTHONPATH: src

      # PT-PT: E o `--cli` corre a seguir, porque e o unico caminho que liga
      #        todos os modulos de uma vez contra a maquina verdadeira. Nos
      #        runners nao ha discos com problemas nem servicos falhados, e por
      #        isso o codigo de saida e ignorado: o que se verifica e que os
      #        onze modulos correm de ponta a ponta sem rebentar num sistema que
      #        nao e o de quem escreveu o codigo.
      # EN-UK: And `--cli` runs next, because it is the only path wiring every
      #        module together against the real machine. The exit code is
      #        ignored: what is verified is that the eleven modules run
      #        end to end without blowing up on a system that is not the
      #        author's.
      - name: Diagnostico completo / Full diagnostic
        run: python -m ittoolkit --cli --sem-relatorio || true
        env:
          PYTHONPATH: src
