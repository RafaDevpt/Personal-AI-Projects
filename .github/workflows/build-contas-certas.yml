# Compila a Contas Certas 2026 e guarda o site na tag contas-certas-build, para ser copiado para
# study-guides/contas-certas (servido em https://rafadevpt.github.io/Personal-AI-Projects/contas-certas/)
# Created by Redfox using Claude
name: Build Contas Certas

on:
  push:
    branches: [contas-certas-src]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contas-certas
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Preparar OCR (tesseract.js + língua portuguesa)
        run: npm run prepare:ocr

      - name: Compilar
        run: npm run build

      # A regra "Protect" do repositório não deixa o bot do Actions escrever em branches.
      # O site compilado fica na tag "contas-certas-build" (as tags não estão protegidas) e quem
      # tem permissão copia-o para study-guides/contas-certas.
      - name: Guardar o site compilado na tag contas-certas-build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          git init -q
          git config user.name "Redfox"
          git config user.email "RafaDevpt@users.noreply.github.com"
          git add -A
          git commit -q -m "Contas Certas build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/tags/contas-certas-build
