# Compila a Contas Certas 2026 e guarda o site como artefacto, para ser copiado para
# study-guides/contas-certas (servido em https://rafadevpt.github.io/Personal-AI-Projects/contas-certas/)
# Created by Redfox using Claude
name: Build Contas Certas

on:
  push:
    branches: [contas-certas-src]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contas-certas
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Preparar OCR (tesseract.js + língua portuguesa)
        run: npm run prepare:ocr

      - name: Compilar
        run: npm run build

      # A regra "Protect" do repositório não deixa o bot do Actions escrever em branches,
      # por isso o resultado fica como artefacto e é publicado em study-guides por quem tem permissão.
      - name: Guardar o site compilado
        uses: actions/upload-artifact@v4
        with:
          name: contas-certas-dist
          path: dist
          retention-days: 7
