<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Personal AI Projects">
  <!-- Created by Redfox using Claude -->

  <defs>
    <!-- Gradiente que percorre o título -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F6FEB"/>
      <stop offset="40%"  stop-color="#8B7FD4"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#8B7FD4"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2"  dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Grelha técnica de fundo -->
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#1F6FEB" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>

    <!-- Scanline que percorre a janela -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#6E5494" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>

    <!-- Máquina de escrever: uma máscara por linha -->
    <clipPath id="t1"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="360" dur="0.9s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="540" dur="0.9s" begin="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="540" dur="0.9s" begin="2.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="540" dur="0.9s" begin="3.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="540" dur="0.8s" begin="4.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t6"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="600" dur="1.2s" begin="5.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="t7"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="600" dur="1.0s" begin="6.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Janela -->
  <rect width="900" height="300" rx="8" fill="#0D1117"/>
  <rect width="900" height="300" rx="8" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- Barra de título -->
  <path d="M0 8 a8 8 0 0 1 8 -8 h884 a8 8 0 0 1 8 8 v28 h-900 z" fill="#161B22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363D" stroke-width="1"/>
  <circle cx="22" cy="18" r="5.5" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="5.5" fill="#FEBC2E"/>
  <circle cx="62" cy="18" r="5.5" fill="#28C840"/>
  <text x="450" y="23" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace"
        font-size="13" fill="#8B949E">ops@infra — ssh — Personal-AI-Projects</text>

  <!-- Scanline em movimento -->
  <rect x="0" y="-90" width="900" height="90" fill="url(#scan)">
    <animate attributeName="y" from="-90" to="300" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Sequência de arranque -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="15">

    <g clip-path="url(#t1)">
      <text x="26" y="66" fill="#58A6FF">ops@infra:~$</text>
      <text x="142" y="66" fill="#C9D1D9">./healthcheck --all</text>
    </g>

    <g clip-path="url(#t2)">
      <text x="26" y="92" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="92" fill="#8B949E">Toolkits loaded ................ 8/8</text>
    </g>

    <g clip-path="url(#t3)">
      <text x="26" y="116" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="116" fill="#8B949E">Targets: Windows · Linux · macOS</text>
    </g>

    <g clip-path="url(#t4)">
      <text x="26" y="140" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="140" fill="#8B949E">Scope: network · printers · vSphere · labs</text>
    </g>

    <g clip-path="url(#t5)">
      <text x="26" y="164" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="164" fill="#8B949E">CI pipelines on every platform .. passing</text>
    </g>
  </g>

  <!-- Título -->
  <g clip-path="url(#t6)">
    <text x="26" y="222"
          font-family="Consolas, 'JetBrains Mono', monospace"
          font-size="40" font-weight="700" letter-spacing="1"
          fill="url(#sweep)">PERSONAL-AI-PROJECTS</text>
  </g>

  <!-- Subtítulo -->
  <g clip-path="url(#t7)" font-family="Consolas, 'JetBrains Mono', monospace" font-size="15">
    <text x="26" y="254" fill="#6E5494">&gt;</text>
    <text x="44" y="254" fill="#8B949E">Sysadmin automation · Network ops · Infrastructure tooling</text>
  </g>

  <!-- Topologia: núcleo e quatro nós, com pacotes a circular -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" fill="#8B949E" text-anchor="middle">
    <g stroke="#30363D" stroke-width="1.2" fill="none">
      <path id="l1" d="M734 92 L632 160"/>
      <path id="l2" d="M734 92 L700 160"/>
      <path id="l3" d="M734 92 L768 160"/>
      <path id="l4" d="M734 92 L836 160"/>
    </g>
    <rect x="694" y="66" width="80" height="26" rx="4" fill="#161B22" stroke="#1F6FEB"/>
    <g fill="#3FB950"><circle cx="706" cy="79" r="2"/><circle cx="714" cy="79" r="2"/><circle cx="722" cy="79" r="2"/>
      <circle cx="730" cy="79" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></circle></g>
    <text x="754" y="83" fill="#C9D1D9">CORE</text>
    <g fill="#161B22" stroke="#30363D">
      <rect x="612" y="160" width="40" height="26" rx="3"/><rect x="680" y="160" width="40" height="26" rx="3"/>
      <rect x="748" y="160" width="40" height="26" rx="3"/><rect x="816" y="160" width="40" height="26" rx="3"/>
    </g>
    <text x="632" y="177">SRV</text><text x="700" y="177">PRN</text><text x="768" y="177">ESXi</text><text x="836" y="177">LAB</text>
    <g fill="#58A6FF">
      <circle r="2.5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="2.5"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle>
      <circle r="2.5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
      <circle r="2.5"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l4"/></animateMotion></circle>
    </g>
  </g>

  <!-- Cursor a piscar -->
  <rect x="26" y="270" width="9" height="17" fill="#58A6FF" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.01s" begin="7.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="7.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Indicadores de estado -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12">
    <circle cx="780" cy="278" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="794" y="282" fill="#484F58">ALL SYSTEMS OK</text>
  </g>
</svg>
