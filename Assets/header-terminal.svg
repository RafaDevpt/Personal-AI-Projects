<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Personal AI Projects — IT operations toolkit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Created by Redfox using Claude -->

  <defs>
    <!-- Gradiente que percorre o título -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F6FEB"/>
      <stop offset="40%"  stop-color="#39C5CF"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#39C5CF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2"  dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Grelha técnica de fundo -->
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#1F6FEB" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>

    <!-- Scanline que percorre a janela -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#39C5CF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>

    <!-- Máquina de escrever: uma máscara por linha -->
    <clipPath id="t1"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="420" dur="0.9s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="660" dur="0.8s" begin="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="660" dur="0.8s" begin="2.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="660" dur="0.8s" begin="2.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="660" dur="0.8s" begin="3.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="t6"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="660" dur="0.8s" begin="4.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t7"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="900" dur="1.2s" begin="5.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="t8"><rect x="0" y="0" width="0" height="300">
      <animate attributeName="width" from="0" to="900" dur="1.0s" begin="6.5s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Janela -->
  <rect width="900" height="300" rx="8" fill="#0D1117"/>
  <rect width="900" height="300" rx="8" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- Barra de título -->
  <path d="M0 8 a8 8 0 0 1 8 -8 h884 a8 8 0 0 1 8 8 v28 h-900 z" fill="#161B22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363D" stroke-width="1"/>
  <circle cx="22" cy="18" r="5.5" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="5.5" fill="#FEBC2E"/>
  <circle cx="62" cy="18" r="5.5" fill="#28C840"/>
  <text x="450" y="23" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace"
        font-size="13" fill="#8B949E">ssh ops@noc — Personal-AI-Projects</text>

  <!-- Scanline em movimento -->
  <rect x="0" y="-90" width="900" height="90" fill="url(#scan)">
    <animate attributeName="y" from="-90" to="300" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Health-check de arranque -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="14">

    <g clip-path="url(#t1)">
      <text x="26" y="64" fill="#3FB950">ops@noc</text>
      <text x="85" y="64" fill="#8B949E">:</text>
      <text x="93" y="64" fill="#58A6FF">~/infra</text>
      <text x="152" y="64" fill="#C9D1D9">$ ./healthcheck --all</text>
    </g>

    <g clip-path="url(#t2)">
      <text x="26" y="88" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="88" fill="#8B949E">inventory ......... 8 tools online</text>
    </g>

    <g clip-path="url(#t3)">
      <text x="26" y="110" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="110" fill="#8B949E">platforms ......... Windows · Linux · macOS</text>
    </g>

    <g clip-path="url(#t4)">
      <text x="26" y="132" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="132" fill="#8B949E">stack ............. Python · PowerShell · Bash</text>
    </g>

    <g clip-path="url(#t5)">
      <text x="26" y="154" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="154" fill="#8B949E">ci pipelines ...... passing</text>
    </g>

    <g clip-path="url(#t6)">
      <text x="26" y="176" fill="#3FB950">[  OK  ]</text>
      <text x="106" y="176" fill="#8B949E">security review ... hardened</text>
    </g>
  </g>

  <!-- Bastidor de servidores -->
  <g transform="translate(704 52)">
    <rect x="0" y="0" width="166" height="138" rx="4" fill="#161B22" stroke="#30363D"/>
    <rect x="6" y="6" width="4" height="126" fill="#21262D"/>
    <rect x="156" y="6" width="4" height="126" fill="#21262D"/>
    <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="9" fill="#6E7681">
      <!-- U1: switch -->
      <rect x="14" y="8" width="138" height="22" rx="2" fill="#0D1117" stroke="#30363D"/>
      <text x="20" y="22">SW-CORE</text>
      <g fill="#30363D">
        <rect x="70" y="14" width="6" height="6"/><rect x="79" y="14" width="6" height="6"/>
        <rect x="88" y="14" width="6" height="6"/><rect x="97" y="14" width="6" height="6"/>
        <rect x="106" y="14" width="6" height="6"/><rect x="115" y="14" width="6" height="6"/>
      </g>
      <circle cx="132" cy="19" r="2.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="142" cy="19" r="2.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/></circle>
      <!-- U2: firewall -->
      <rect x="14" y="34" width="138" height="22" rx="2" fill="#0D1117" stroke="#30363D"/>
      <text x="20" y="48">FW-EDGE</text>
      <circle cx="132" cy="45" r="2.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="142" cy="45" r="2.5" fill="#D29922"><animate attributeName="opacity" values="1;0.2;1" dur="0.5s" repeatCount="indefinite"/></circle>
      <!-- U3-U5: servidores -->
      <rect x="14" y="60" width="138" height="22" rx="2" fill="#0D1117" stroke="#30363D"/>
      <text x="20" y="74">SRV-01</text>
      <rect x="70" y="67" width="48" height="8" rx="1" fill="#21262D"/>
      <circle cx="132" cy="71" r="2.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="142" cy="71" r="2.5" fill="#58A6FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.3s" repeatCount="indefinite"/></circle>
      <rect x="14" y="86" width="138" height="22" rx="2" fill="#0D1117" stroke="#30363D"/>
      <text x="20" y="100">SRV-02</text>
      <rect x="70" y="93" width="48" height="8" rx="1" fill="#21262D"/>
      <circle cx="132" cy="97" r="2.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="142" cy="97" r="2.5" fill="#58A6FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/></circle>
      <rect x="14" y="112" width="138" height="20" rx="2" fill="#0D1117" stroke="#30363D"/>
      <text x="20" y="125">NAS-BKP</text>
      <rect x="70" y="118" width="48" height="8" rx="1" fill="#21262D"/>
      <circle cx="132" cy="122" r="2.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="142" cy="122" r="2.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Título -->
  <g clip-path="url(#t7)">
    <text x="26" y="226"
          font-family="Consolas, 'JetBrains Mono', monospace"
          font-size="40" font-weight="700" letter-spacing="1"
          fill="url(#sweep)">PERSONAL-AI-PROJECTS</text>
  </g>

  <!-- Subtítulo -->
  <g clip-path="url(#t8)" font-family="Consolas, 'JetBrains Mono', monospace" font-size="14">
    <text x="26" y="254" fill="#39C5CF">&gt;</text>
    <text x="44" y="254" fill="#8B949E">Infrastructure · Networking · Security · Automation</text>
  </g>

  <!-- Cursor a piscar -->
  <rect x="448" y="241" width="8" height="16" fill="#58A6FF" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.01s" begin="7.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="7.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Barra de estado (estilo tmux) -->
  <rect x="0.5" y="272" width="899" height="27.5" fill="#161B22"/>
  <line x1="0" y1="272" x2="900" y2="272" stroke="#30363D" stroke-width="1"/>
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12">
    <rect x="12" y="278" width="58" height="16" rx="2" fill="#1F6FEB" fill-opacity="0.25"/>
    <text x="41" y="290" text-anchor="middle" fill="#58A6FF">[ops]</text>
    <text x="82" y="290" fill="#6E7681">0:healthcheck*  1:network  2:backup</text>
    <circle cx="664" cy="286" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="676" y="290" fill="#8B949E">ALL SYSTEMS OPERATIONAL</text>
  </g>
</svg>
