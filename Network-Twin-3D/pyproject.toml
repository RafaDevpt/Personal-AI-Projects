# PT-PT: Metadados do projecto e configuracao das ferramentas.
# EN-UK: Project metadata and tool configuration.
#
# Created by Redfox using Claude

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-twin-3d"
version = "0.3.0"
description = "Gemeo digital da rede em 3D: o que existe vs o que foi desenhado / 3D network digital twin: as-built vs as-designed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael Santos (Redfox)" }]
keywords = ["networking", "digital-twin", "3d", "vlan", "lldp", "topology", "rack", "floor-plan", "dxf", "pywebview", "threejs", "openstreetmap", "homography", "facade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = ["pywebview>=5.0,<7.0"]

[project.optional-dependencies]
# PT-PT: Só para o editor de edifícios: DXF (CAD) e PDF. Sem elas, imagens
#        (PNG, JPG…) continuam a funcionar.
# EN-UK: Building editor only: DXF (CAD) and PDF. Images work without them.
importacao = ["ezdxf>=1.3", "pypdfium2>=4.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "ezdxf>=1.3", "pillow>=10.0"]

[project.scripts]
nettwin = "nettwin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nettwin = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/nettwin/web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# PT-PT: E501 fica de fora porque os comentarios bilingues sao naturalmente
#        longos, e cortar frases a meio para caber tornaria-os ilegiveis.
# EN-UK: E501 is excluded because the bilingual comments are naturally long.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
