# PT-PT: Metadados do projecto e configuracao das ferramentas.
# EN-UK: Project metadata and tool configuration.
#
# Created by Redfox using Claude

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-topology-mapper-linux"
version = "2.0.0"
description = "Mapeamento da rede do controlador ao equipamento final / Network mapping from the controller to the end device"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rafael Santos (Redfox)" }]
keywords = ["networking", "topology", "lldp", "cdp", "mac-address-table", "unifi", "netmiko", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "customtkinter>=5.2.2,<6.0",
    "netmiko>=4.3,<5.0",
    "openpyxl>=3.1,<4.0",
    "reportlab>=4.0,<5.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
netmap = "netmap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# PT-PT: E501 fica de fora porque os comentarios bilingues sao naturalmente
#        longos, e cortar frases a meio para caber tornaria-os ilegiveis.
# EN-UK: E501 is excluded because the bilingual comments are naturally long,
#        and breaking sentences to fit would make them unreadable.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
